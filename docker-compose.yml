name: immich-semantic-captioner

services:
  immich-captioner:
    container_name: immich_captioner

    build:
      context: ./captioner
      dockerfile: Dockerfile
      args:
        CUDA_BASE_IMAGE: ${CUDA_BASE_IMAGE}

    image: immich-semantic-captioner:${IMAGE_TAG:-known-good}

    networks:
      - immich_default

    # Secrets come from ~/.api-keys (IMMICH_API_KEY, IMMICH_DB_PASSWORD), not .env.
    # Recreate with scripts/compose.sh, which sources that file first; the :? guards
    # make a bare `docker compose up` from a shell without it fail instead of starting
    # with blank credentials. Addresses use CAPTIONER_-prefixed overrides so the
    # host-side IMMICH_URL in ~/.api-keys never leaks into the container.
    environment:
      - IMMICH_URL=${CAPTIONER_IMMICH_URL:-http://immich_server:2283}
      - IMMICH_API_KEY=${IMMICH_API_KEY:?IMMICH_API_KEY unset - source ~/.api-keys or use scripts/compose.sh}

      - BATCH_SIZE=${BATCH_SIZE}
      - SLEEP_SECONDS=${SLEEP_SECONDS}
      - IDLE_SLEEP_SECONDS=${IDLE_SLEEP_SECONDS}
      - MAX_CAPTION_CHARS=${MAX_CAPTION_CHARS}
      - USER_AGENT=${USER_AGENT}

      - DRY_RUN=${DRY_RUN}
      - CAPTION_VIDEOS=${CAPTION_VIDEOS}
      - VIDEO_TAIL_SECONDS=${VIDEO_TAIL_SECONDS}
      - VIDEO_TAIL_INTERVAL_SECONDS=${VIDEO_TAIL_INTERVAL_SECONDS}
      - VIDEO_HEAD_FRAME_COUNT=${VIDEO_HEAD_FRAME_COUNT}
      - MAX_VIDEO_FRAMES=${MAX_VIDEO_FRAMES}
      - ENABLE_TAGS=${ENABLE_TAGS}

      - FLORENCE_MODEL=${FLORENCE_MODEL}
      - JOYCAPTION_MODEL=${JOYCAPTION_MODEL}
      - EXPLICIT_CAPTIONS=${EXPLICIT_CAPTIONS}
      - STAMP_PORN_CAPTION_DATE=${STAMP_PORN_CAPTION_DATE:-1}

      - PGHOST=${CAPTIONER_PGHOST:-immich_postgres}
      - PGPORT=${CAPTIONER_PGPORT:-5432}
      - PGDATABASE=${CAPTIONER_PGDATABASE:-immich}
      - PGUSER=${CAPTIONER_PGUSER:-postgres}
      - PGPASSWORD=${IMMICH_DB_PASSWORD:?IMMICH_DB_PASSWORD unset - source ~/.api-keys or use scripts/compose.sh}
      - USE_API_ONLY=${USE_API_ONLY}
      - PYTHONPATH=/opt/overrides
      - IDENTITY_ALBUM_MAP=${IDENTITY_ALBUM_MAP}
      - IDENTITY_NOUN_HINTS=${IDENTITY_NOUN_HINTS}
      - IDENTITY_ENSURE_MODE=${IDENTITY_ENSURE_MODE}
      - PEOPLE_NAME_OVERRIDES=${PEOPLE_NAME_OVERRIDES}
      - IDENTITY_AUTHORITATIVE_ALBUM_KEYWORDS=${IDENTITY_AUTHORITATIVE_ALBUM_KEYWORDS}
      - IDENTITY_ALBUM_PREFIX_MAP=${IDENTITY_ALBUM_PREFIX_MAP}

    gpus: all
    restart: unless-stopped

    volumes:
      - captioner-hf-cache:/root/.cache/huggingface
      - ./captioner/captioner.py:/app/captioner.py:ro
      - ./captioner/overrides:/opt/overrides:ro

volumes:
  captioner-hf-cache:

networks:
  immich_default:
    external: true
